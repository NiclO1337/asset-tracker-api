name: CI

on:
  push:
  pull_request:

# Read-only token: this workflow only reads the code (X12).
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Actions are pinned to full commit SHAs; tags can be moved, commits can't.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the SDK version from global.json.
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      # dotnet list package always exits 0, so fail the step when the report lists a vulnerable package.
      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee "$RUNNER_TEMP/vulnerable.txt"
          if grep -q "has the following vulnerable packages" "$RUNNER_TEMP/vulnerable.txt"; then
            exit 1
          fi
